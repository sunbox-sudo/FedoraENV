ines/_template.conf - template for a FedoraENV machine profile
# =============================================================================
# HOW TO USE
#   1. Copy this file and name it after the machine's hostname:
#        cp machines/_template.conf machines/<hostname>
#      (machines/<hostname>.conf works too, like vm.conf)
#   2. Fill in the values below.
#   A profile can also be chosen by hand:  fedora-env --profile <name>
#   The leading underscore keeps this template from being picked by accident.
#
# HOW IT IS READ
#   fedora-env SOURCES this file as bash. So:
#   - Only plain assignments (NAME=value). No "declare", no "local", otherwise
#     the value does not reach the main script.
#   - No commands that do things. This file only describes the machine.
#   - Quote values that contain spaces: NAME="a b".
#
# KEEP IT SMALL
#   Settings that are the same on every machine belong in the stages or in
#   config/, not here. Only what is DIFFERENT for this machine goes in a profile.
# =============================================================================

# -----------------------------------------------------------------------------
# STAGES (required)
#   The stages to run, in this order. Each name is a file stages/<name>.sh.
#   Every profile lists its own stages, there is no shared default.
# -----------------------------------------------------------------------------
STAGES=(
  # example
  # example2
)

# -----------------------------------------------------------------------------
# PER-MACHINE SETTINGS (optional)
#   Stages read these as normal variables. The names below are examples taken
#   from your plan. Keep, rename or delete them. A stage that uses a variable
#   should give it a default (${VAR:-default}) so a profile can leave it out.
# -----------------------------------------------------------------------------

# Hardware: AMD only for now; NVIDIA handling may come later.
# GPU="amd"

# Laptop-only things such as battery tools.
# HAS_BATTERY=0

# Monitors, in whatever format the Hyprland/DWM stages will expect.
# MONITORS=""

# Copy this machine's SSH keys with the dotfiles tooling? (0 = no, 1 = yes)
# SETUP_SSH_KEYS=0
